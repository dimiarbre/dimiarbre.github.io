        start_date: 2023
        end_date: present
        highlights:
          - "Advisors: Davide Frey, Romaric Gaudel, François Taïani"
          - "Exploring privacy in decentralized learning via noise correlation, from theoretical foundations to practical methods."

      - institution: ENS Rennes
        location: Rennes, France
        studyType: "Master's degree (M2 SIF) in Computer Science"
        start_date: 2022
        end_date: 2023
        highlights:
          - "Focus on machine learning, image representation, and complex systems."

      - institution: ENS Rennes
        location: Rennes, France
        studyType: 'Preparation for the "Agrégation d''informatique"'
        start_date: 2021
        end_date: 2022
        highlights:
          - "Focus on teaching and computer science fundamentals: algorithms, architecture, operating systems, networking, and databases."

