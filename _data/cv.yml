        start_date: 2025
        end_date: 2025
        summary: "Decentralized learning convergence under fragmentation. Supervisor: Anne-Marie Kermarrec"
        highlights:
          - "Studied theoretical convergence rates of decentralized learning with model fragmentation."

      - company: "Team WIDE, INRIA Rennes"
        position: Research Intern
        location: Rennes, France
        start_date: 2023
        end_date: 2023
        summary: "Privacy protection through private averaging. Supervisors: Davide Frey, François Taïani, Romaric Gaudel"
        highlights:
          - "Studied privacy properties of decentralized machine learning and the effects of private averaging using PyTorch."

      - company: "D7, IRISA Rennes"
        position: Research Intern
        location: Rennes, France
        start_date: 2021
        end_date: 2021
        summary: "Adapting Public Announcement Logic update mechanisms to Dynamic Epistemic Logic. Supervisor: Guillaume Aucher"

      - company: "Percept, INRIA Rennes"
        position: Research Project
        location: Rennes, France
        start_date: 2020
        end_date: 2021
        summary: "Feature extraction for high dynamic range images. Supervisors: Olivier Le Meur, Mathieu Chambe"
        highlights:
          - "Built a neural network for HDR image feature extraction in TensorFlow."

      - company: "Mnemosyne, INRIA Bordeaux"
        position: Research Intern
        location: Bordeaux, France
        start_date: 2020
        end_date: 2020
        summary: "Visualization of echo state networks. Supervisor: Nicolas Rougier"
        highlights:
          - "Developed a spatialized ESN and visualized activity using Voronoi diagrams."

