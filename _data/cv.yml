cv:
  name: Dimitri Lerévérend
  label: Ph.D. Student in Privacy-Preserving Decentralized Learning
  email: dimitri.lereverend@inria.fr
  location: Rennes, France
  image: "assets/img/my_photo.png"
  summary: >
    I am a Ph.D. student in privacy-preserving decentralized learning at INRIA Rennes.
    My research focuses on privacy techniques for decentralized learning, with a particular
    emphasis on noise correlation. I work on both theory and practice to design approaches
    that are scalable, tractable, and supported by strong privacy guarantees.

